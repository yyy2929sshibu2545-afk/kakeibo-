<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>よしや＆りん 家計簿</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>
<body class="bg-slate-200 flex justify-center h-screen overflow-hidden font-sans">
  
  <div id="app" class="w-full max-w-md bg-slate-50 h-full flex flex-col relative shadow-xl overflow-hidden">
    <div id="contentArea" class="flex-1 overflow-y-auto relative pb-28"></div>

    <nav class="absolute bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-100 flex justify-around items-center pt-3 pb-8 px-2 z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
      <button onclick="switchTab('dashboard')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-tab="dashboard">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" /></svg>
        <span class="text-[10px] font-bold">ホーム</span>
      </button>
      <button onclick="switchTab('scan')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-tab="scan">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="text-[10px] font-bold">仕分け</span>
      </button>
      <button onclick="switchTab('history')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-tab="history">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
        <span class="text-[10px] font-bold whitespace-nowrap">履歴/内訳</span>
      </button>
      <button onclick="switchTab('fixed')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-tab="fixed">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        <span class="text-[10px] font-bold">出費管理</span>
      </button>
      <button onclick="switchTab('utilities')" class="nav-btn flex flex-col items-center gap-1 w-16 transition-colors" data-tab="utilities">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
        <span class="text-[10px] font-bold">光熱費</span>
      </button>
    </nav>
  </div>

  <script>
    // ==========================================
    // バックエンド通信設定
    // ==========================================
    const BASE_URL = "http://localhost:8000";

    const initialData = {
      ratio: { yoshiya: 0.58, rin: 0.42 },
      sharedFixed: [
        { name: "家賃（駐車場込）", amount: 51813 },
        { name: "火災保険", amount: 570 },
        { name: "Locca（サーバー）", amount: 2780 }
      ],
      sharedVariable: {
        electricity: 7473, gas: 7000, water: 3000
      },
      personalFixed: {
        yoshiya: {
          income: 208640,
          savings: { shared: 30000, personal: 20000 },
          savingsHistory: [],
          items: [
            { id: 1, name: "車ローン", amount: 35000 },
            { id: 2, name: "ahamo基本料", amount: 2700 },
            { id: 3, name: "端末分割代金①", amount: 3730 },
            { id: 4, name: "端末分割代金②", amount: 3319 },
            { id: 5, name: "持ち運びメール", amount: 300 },
            { id: 6, name: "アハモ光（Wi-Fi）", amount: 4400 },
            { id: 7, name: "Locca（サーバー）", amount: 2780 },
            { id: 8, name: "Spotify Family", amount: 1880 },
            { id: 9, name: "Google AI Pro", amount: 1450 },
            { id: 10, name: "Amazon Prime", amount: 492 },
            { id: 11, name: "iCloud", amount: 180 },
            { id: 12, name: "美容室（月換算）", amount: 2250 }
          ]
        },
        rin: {
          income: 180000,
          savings: { shared: 30000, personal: 20000 },
          savingsHistory: [],
          items: [
            { id: 13, name: "スマホ代", amount: 3500 },
            { id: 14, name: "車代", amount: 20000 },
            { id: 15, name: "車両保険", amount: 9000 },
            { id: 16, name: "生命保険", amount: 8015 },
            { id: 17, name: "ネトフリ/LINE", amount: 890 },
            { id: 18, name: "iCloud", amount: 180 },
            { id: 19, name: "ChatGPT", amount: 1400 },
            { id: 20, name: "ピル代", amount: 2500 },
            { id: 21, name: "美容室（月換算）", amount: 5000 }
          ]
        }
      },
      receipts: [
        { id: 1, date: "2026-08-15", store: "スーパーよしや", name: "食料品まとめ買い", amount: 3500, category: "食費", owner: "共通", payer: "yoshiya" },
        { id: 2, date: "2026-08-16", store: "ラーメン屋", name: "まぜそば", amount: 300, category: "食費", owner: "yoshiya", payer: "yoshiya" },
        { id: 3, date: "2026-08-18", store: "ニトリ", name: "タンブラー", amount: 1500, category: "生活雑貨", owner: "rin", payer: "rin" },
        { id: 4, date: "2026-08-20", store: "居酒屋 和民", name: "飲み代", amount: 4500, category: "交際費", owner: "共通", payer: "yoshiya" },
        { id: 5, date: "2026-08-25", store: "TOHOシネマズ", name: "映画チケット", amount: 4000, category: "デート費", owner: "共通", payer: "rin" }
      ],
      utilityHistory: [
        { month: "25年4月", electricity: 6398, gas: 5907, water: 2398 },
        { month: "25年5月", electricity: 6398, gas: 5907, water: 2398 },
        { month: "25年6月", electricity: 7174, gas: 4879, water: 2332 },
        { month: "25年7月", electricity: 7497, gas: 4461, water: 9900 },
        { month: "25年8月", electricity: 7548, gas: 3603, water: 2475 }
      ]
    };

    const currentMonthYYYYMM = new Date().toISOString().substring(0, 7);
    
    // アプリのグローバル状態
    let state = {
      tab: 'dashboard',
      fixedTab: 'yoshiya', // 'yoshiya' or 'rin'
      data: JSON.parse(JSON.stringify(initialData)), // フォールバックデータ
      scan: { staging: [], loading: false, chatMsg: '' },
      historyMonth: currentMonthYYYYMM,
      editingReceiptId: null,
      expandedGroups: {},
      newUtility: { month: '', electricity: '', gas: '', water: '' },
      settlements: {}
    };

    // ==========================================
    // バックエンド通信関数群
    // ==========================================
    
    // 起動時のデータ取得
    async function initApp() {
      try {
        const response = await fetch(`${BASE_URL}/api/data`);
        if (response.ok) {
          const data = await response.json();
          if (data && Object.keys(data).length > 0) {
             state.data = data;
          } else {
             // サーバー側にデータがない場合は初期データを送信
             state.data = JSON.parse(JSON.stringify(initialData));
             await saveData();
          }
        } else {
          console.warn("サーバーからのデータ取得に失敗しました。デフォルトデータを使用します。");
        }
      } catch (e) {
        console.error("通信エラー:", e);
      } finally {
        render();
      }
    }

    // データの保存（非同期・オプティミスティックUIのためawaitせず呼び出すことが多い）
    async function saveData() {
      try {
        const response = await fetch(`${BASE_URL}/api/data`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state.data)
        });
        if (!response.ok) {
          throw new Error('保存に失敗しました');
        }
      } catch (e) {
        console.error("データの保存エラー:", e);
        customAlert("データの保存に失敗しました。サーバーの状態を確認してください。");
      }
    }

    // データリセット（初期化）
    function resetData() {
      customConfirm('データをすべて初期化しますか？', async () => {
        state.data = JSON.parse(JSON.stringify(initialData));
        await saveData();
        location.reload();
      });
    }

    // ==========================================
    // UIロジック
    // ==========================================

    function toggleSettlement(month) {
      if (!state.settlements) state.settlements = {};
      state.settlements[month] = !state.settlements[month];
      render();
    }

    function toggleGroup(key) {
      state.expandedGroups[key] = !state.expandedGroups[key];
      render();
    }

    // Styling helpers
    function getOwnerClasses(owner) {
      if(owner === 'yoshiya') return 'bg-orange-100 text-orange-700 border-orange-200';
      if(owner === 'rin') return 'bg-pink-100 text-pink-700 border-pink-200';
      return 'bg-green-100 text-green-700 border-green-200';
    }
    
    function getOwnerLabel(owner) {
      if(owner === 'yoshiya') return 'よしや';
      if(owner === 'rin') return 'りん';
      return '共通';
    }

    function getCategoryStyle(cat) {
      if(cat === '食費') return 'bg-orange-50 text-orange-600 border-orange-100';
      if(cat === '生活雑貨') return 'bg-blue-50 text-blue-600 border-blue-100';
      if(cat === '交際費') return 'bg-purple-50 text-purple-600 border-purple-100';
      if(cat === 'デート費') return 'bg-rose-50 text-rose-600 border-rose-100';
      return 'bg-slate-50 text-slate-600 border-slate-100';
    }

    function getTheme(owner) {
      if (owner === 'yoshiya') {
        return {
           bg50: 'bg-orange-50', bg100: 'bg-orange-100', bg500: 'bg-orange-500',
           text500: 'text-orange-500', text600: 'text-orange-600', text700: 'text-orange-700', text800: 'text-orange-800',
           border100: 'border-orange-100', border200: 'border-orange-200', border300: 'border-orange-300',
           focusBorder400: 'focus:border-orange-400', focusBorder500: 'focus:border-orange-500',
           hoverBorder300: 'hover:border-orange-300', hoverText500: 'hover:text-orange-500',
           focusWithinBorder300: 'focus-within:border-orange-300'
        };
      } else {
        return {
           bg50: 'bg-pink-50', bg100: 'bg-pink-100', bg500: 'bg-pink-500',
           text500: 'text-pink-500', text600: 'text-pink-600', text700: 'text-pink-700', text800: 'text-pink-800',
           border100: 'border-pink-100', border200: 'border-pink-200', border300: 'border-pink-300',
           focusBorder400: 'focus:border-pink-400', focusBorder500: 'focus:border-pink-500',
           hoverBorder300: 'hover:border-pink-300', hoverText500: 'hover:text-pink-500',
           focusWithinBorder300: 'focus-within:border-pink-300'
        };
      }
    }

    function formatMonth(ym) {
      const [y, m] = ym.split('-');
      return `${y.slice(2)}年${parseInt(m, 10)}月`;
    }

    function calculateSummary(monthYYYYMM) {
      // 1. Incomes
      const yIncome = state.data.personalFixed.yoshiya.income;
      const rIncome = state.data.personalFixed.rin.income;
      const totalIncome = yIncome + rIncome;

      // 2. Fixed Costs
      const sFixed = state.data.sharedFixed.reduce((sum, item) => sum + item.amount, 0);
      const yFixed = state.data.personalFixed.yoshiya.items.reduce((sum, item) => sum + item.amount, 0);
      const rFixed = state.data.personalFixed.rin.items.reduce((sum, item) => sum + item.amount, 0);
      const totalPersonalFixed = yFixed + rFixed;

      // 3. Utilities
      const currentUtil = state.data.utilityHistory.find(u => u.month === formatMonth(monthYYYYMM));
      const varSum = currentUtil ? (currentUtil.electricity + currentUtil.gas + currentUtil.water) : (state.data.sharedVariable.electricity + state.data.sharedVariable.gas + state.data.sharedVariable.water);

      // 4. Receipts
      const currentReceipts = state.data.receipts.filter(r => r.date.startsWith(monthYYYYMM));
      const totalReceipts = currentReceipts.reduce((sum, r) => sum + r.amount, 0);

      let foodTotal = 0, dailyTotal = 0, socialTotal = 0, dateTotal = 0;
      let yPersonalReceipts = 0, rPersonalReceipts = 0;
      let commonReceiptsSum = 0;
      let rPaidCommonReceipts = 0, yPaidRinPersonal = 0, rPaidYoshiyaPersonal = 0;

      currentReceipts.forEach(r => {
        if(r.category === '食費') foodTotal += r.amount;
        if(r.category === '生活雑貨') dailyTotal += r.amount;
        if(r.category === '交際費') socialTotal += r.amount;
        if(r.category === 'デート費') dateTotal += r.amount;

        if(r.owner === '共通') {
          commonReceiptsSum += r.amount;
          if(r.payer === 'rin') rPaidCommonReceipts += r.amount;
        }
        if(r.owner === 'yoshiya') {
          yPersonalReceipts += r.amount;
          if(r.payer === 'rin') rPaidYoshiyaPersonal += r.amount;
        }
        if(r.owner === 'rin') {
          rPersonalReceipts += r.amount;
          if(r.payer === 'yoshiya') yPaidRinPersonal += r.amount;
        }
      });

      // 5. Common calculations (58:42)
      const totalCommon = sFixed + varSum + commonReceiptsSum;
      const yShare = Math.round(totalCommon * state.data.ratio.yoshiya);
      const rShare = totalCommon - yShare;

      // 6. Settlement (Rin -> Yoshiya transfer amount)
      const rinTransferAmount = rShare - rPaidCommonReceipts + yPaidRinPersonal - rPaidYoshiyaPersonal;

      // 7. Remaining Free Money
      const yRemaining = yIncome - yFixed - yShare - yPersonalReceipts;
      const rRemaining = rIncome - rFixed - rShare - rPersonalReceipts;

      // 8. Household remaining
      const totalRemaining = yRemaining + rRemaining;

      // 9. Percentages for Stacked Bar
      const safeTotal = totalIncome || 1;
      const pCommon = (sFixed / safeTotal) * 100;
      const pUtil = (varSum / safeTotal) * 100;
      const pVar = (totalReceipts / safeTotal) * 100;
      const pPersonal = (totalPersonalFixed / safeTotal) * 100;
      const pRemain = Math.max(0, 100 - pCommon - pUtil - pVar - pPersonal);

      return {
        yIncome, rIncome, totalIncome,
        sFixed, yFixed, rFixed, totalPersonalFixed,
        varSum,
        totalReceipts, foodTotal, dailyTotal, socialTotal, dateTotal,
        commonReceiptsSum, yPersonalReceipts, rPersonalReceipts,
        totalCommon, yShare, rShare,
        rinTransferAmount,
        yRemaining, rRemaining, totalRemaining,
        pCommon, pUtil, pVar, pPersonal, pRemain,
        currentReceipts
      };
    }

    // ==========================================
    // レンダリング関数群
    // ==========================================
    
    function renderDashboard() {
      const currentMonth = new Date().toISOString().substring(0, 7);
      const s = calculateSummary(currentMonth);
      const isSettled = state.settlements && state.settlements[currentMonth];

      return `
        <div class="p-5 animate-[fadeIn_0.2s_ease-out]">
          
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-slate-800">ホーム</h2>
            <button onclick="resetData()" class="text-xs text-slate-400 font-bold bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition-colors border border-slate-200 shadow-sm"><i class="fas fa-trash-restore mr-1"></i>初期化</button>
          </div>

          <!-- 1. 最上部：今月の精算ハイライトカード -->
          <div class="bg-gradient-to-br ${s.rinTransferAmount >= 0 ? 'from-rose-400 to-orange-400' : 'from-orange-400 to-rose-400'} rounded-3xl p-6 shadow-lg mb-6 text-white relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/10 rounded-full z-0"></div>
            <div class="relative z-10 flex justify-between items-end">
              <div>
                <p class="text-[11px] font-bold text-white/80 uppercase tracking-widest mb-1">今月の精算ハイライト</p>
                <p class="text-sm font-bold mb-1">${s.rinTransferAmount >= 0 ? 'りん ➔ よしや 送金目安' : 'よしや ➔ りん 送金目安'}</p>
                <p class="text-3xl font-black">¥${Math.abs(s.rinTransferAmount).toLocaleString()}</p>
              </div>
              <button onclick="toggleSettlement('${currentMonth}')" class="px-4 py-2.5 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1 ${isSettled ? 'bg-green-500/90 text-white' : 'bg-white text-orange-500 active:scale-95'}">
                <i class="fas ${isSettled ? 'fa-check' : 'fa-exchange-alt'}"></i>
                ${isSettled ? '送金済み' : '送金済みにする'}
              </button>
            </div>
          </div>

          <!-- 2. 世帯全体のキャッシュフローメーター -->
          <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-6">
            <h3 class="text-sm font-bold text-slate-600 mb-4 flex justify-between">
              <span>世帯の残り予算</span>
              <span class="text-slate-400 text-xs bg-slate-50 px-2 py-0.5 rounded-md">${formatMonth(currentMonth)}</span>
            </h3>
            <div class="mb-4">
              <p class="text-[11px] font-bold text-slate-400 mb-1">世帯手取り合計: ¥${s.totalIncome.toLocaleString()}</p>
              <p class="text-4xl font-black text-slate-800">¥${s.totalRemaining.toLocaleString()}</p>
            </div>
            
            <div class="w-full bg-slate-100 h-3 rounded-full flex overflow-hidden mb-4 shadow-inner">
              <div style="width: ${s.pCommon}%" class="bg-blue-400 h-full border-r border-white/50"></div>
              <div style="width: ${s.pUtil}%" class="bg-yellow-400 h-full border-r border-white/50"></div>
              <div style="width: ${s.pVar}%" class="bg-emerald-400 h-full border-r border-white/50"></div>
              <div style="width: ${s.pPersonal}%" class="bg-purple-400 h-full border-r border-white/50"></div>
              <div style="width: ${s.pRemain}%" class="bg-slate-200 h-full"></div>
            </div>
            
            <div class="flex flex-wrap gap-2.5 text-[10px] font-bold text-slate-500">
              <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-blue-400 shadow-sm"></div>共通固定</div>
              <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-yellow-400 shadow-sm"></div>光熱費</div>
              <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-sm"></div>変動費</div>
              <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-purple-400 shadow-sm"></div>個人固定</div>
              <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-slate-200 shadow-sm"></div>残り自由費</div>
            </div>
          </div>

          <!-- 3. 個人バランスカード（2列） -->
          <div class="grid grid-cols-2 gap-3 mb-6">
            <!-- Yoshiya -->
            <div class="bg-orange-50/70 rounded-3xl p-4 border border-orange-100 shadow-sm relative">
              <p class="text-xs font-bold text-orange-600 mb-3 flex justify-between items-center">よしや <span class="text-[9px] bg-orange-100 px-1.5 py-0.5 rounded-full">58%</span></p>
              <div class="space-y-1.5 text-[10px] text-slate-600 font-bold mb-3">
                <div class="flex justify-between"><span>手取り</span><span>¥${s.yIncome.toLocaleString()}</span></div>
                <div class="flex justify-between text-orange-700/80"><span>共通負担</span><span>-¥${s.yShare.toLocaleString()}</span></div>
                <div class="flex justify-between text-orange-700/80"><span>個人固定</span><span>-¥${s.yFixed.toLocaleString()}</span></div>
              </div>
              <div class="pt-2 border-t border-orange-200/50">
                <p class="text-[9px] font-bold text-orange-50 mb-0.5">残り自由費</p>
                <p class="text-lg font-black text-orange-600">¥${s.yRemaining.toLocaleString()}</p>
              </div>
            </div>
            
            <!-- Rin -->
            <div class="bg-pink-50/70 rounded-3xl p-4 border border-pink-100 shadow-sm relative">
              <p class="text-xs font-bold text-pink-600 mb-3 flex justify-between items-center">りん <span class="text-[9px] bg-pink-100 px-1.5 py-0.5 rounded-full">42%</span></p>
              <div class="space-y-1.5 text-[10px] text-slate-600 font-bold mb-3">
                <div class="flex justify-between"><span>手取り</span><span>¥${s.rIncome.toLocaleString()}</span></div>
                <div class="flex justify-between text-pink-700/80"><span>共通負担</span><span>-¥${s.rShare.toLocaleString()}</span></div>
                <div class="flex justify-between text-pink-700/80"><span>個人固定</span><span>-¥${s.rFixed.toLocaleString()}</span></div>
              </div>
              <div class="pt-2 border-t border-pink-200/50">
                <p class="text-[9px] font-bold text-pink-500 mb-0.5">残り自由費</p>
                <p class="text-lg font-black text-pink-600">¥${s.rRemaining.toLocaleString()}</p>
              </div>
            </div>
          </div>

          <!-- 4. 今月の支出内訳カード -->
          <div class="bg-white rounded-3xl shadow-sm border border-slate-100 mb-6 overflow-hidden">
            <div class="p-4 border-b border-slate-50 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><i class="fas fa-home text-sm"></i></div>
                <span class="font-bold text-sm text-slate-700">共通固定費</span>
              </div>
              <span class="font-black text-slate-700 text-lg">¥${s.sFixed.toLocaleString()}</span>
            </div>
            
            <div class="p-4 border-b border-slate-50 flex items-center justify-between">

    // ==========================================
    // バックエンド経由のレシートAI解析処理
    // ==========================================
    async function parseReceipt() {
      const input = document.getElementById('chatInput').value;
      const fileInput = document.getElementById('cameraInput');
      const file = fileInput ? fileInput.files[0] : null;

      if (!file && !input.trim()) {
        customAlert("画像かメモを入力してください。");
        return;
      }

      state.scan.loading = true;
      state.scan.chatMsg = '';
      render();

      try {
        let base64 = undefined;
        let mime = undefined; // バックエンドがmimeを必要とする場合
        if (file) {
          base64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const MAX_SIZE = 800; // 極限圧縮：長辺800pxに縮小

                if (width > height) {
                  if (width > MAX_SIZE) {
                    height = Math.round(height * MAX_SIZE / width);
                    width = MAX_SIZE;
                  }
                } else {
                  if (height > MAX_SIZE) {
                    width = Math.round(width * MAX_SIZE / height);
                    height = MAX_SIZE;
                  }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // 極限圧縮：グレースケール（白黒）化
                const imgData = ctx.getImageData(0, 0, width, height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                  const avg = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
                  data[i] = avg;
                  data[i+1] = avg;
                  data[i+2] = avg;
                }
                ctx.putImageData(imgData, 0, 0);

                // JPEG画質 0.5でエンコード
                const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                const [meta, b64Data] = dataUrl.split(',');
                mime = meta.split(':')[1].split(';')[0];
                resolve(b64Data);
              };
              img.src = e.target.result;
            };
            reader.readAsDataURL(file);
          });
        }

        const payload = {};
        if (base64) payload.image_base64 = base64;
        if (input.trim()) payload.memo = input.trim();

        const res = await fetch(`${BASE_URL}/api/parse-receipt`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
           throw new Error(`サーバーエラー: ${res.status}`);
        }

        const jsonResponse = await res.json();
        
        // FastAPI側からの返却値（テキスト）をパースする
        // ※ サーバー側の実装に合わせて柔軟に取り出せるようにする
        let responseText = "";
        if (typeof jsonResponse === 'string') {
           responseText = jsonResponse;
        } else if (jsonResponse.text) {
           responseText = jsonResponse.text;
        } else if (jsonResponse.result) {
           responseText = jsonResponse.result;
        } else {
           responseText = JSON.stringify(jsonResponse);
        }
        
        let jsonContent;
        try {
          jsonContent = JSON.parse(responseText);
        } catch(e) {
          // Markdownの不要なコードブロックなどを取り除いて再パース
          const cleaned = responseText.replace(/```json/g, '').replace(/```/g, '').trim();
          jsonContent = JSON.parse(cleaned);
        }
        
        if (Array.isArray(jsonContent)) {
          state.scan.staging = jsonContent.map(item => {
            let cat = '食費';
            if (item.category === 'daily') cat = '生活雑貨';
            if (item.category === 'social') cat = '交際費';
            if (item.category === 'date') cat = 'デート費';
            
            return {
              date: item.date || new Date().toISOString().split('T')[0],
              store: item.store || '不明',
              name: item.name,
              amount: item.price || 0,
              category: cat,
              owner: item.owner === 'common' ? '共通' : (item.owner === 'yoshiya' ? 'yoshiya' : 'rin'),
              payer: 'yoshiya' // Default payer
            }
          });
        } else {
          state.scan.chatMsg = "正しく解析できませんでした。";
        }
      } catch(e) {
        console.error("解析エラー:", e);
        customAlert("エラーが発生しました: " + e.message);
      } finally {
        state.scan.loading = false;
        render();
      }
    }

    function confirmStaging() {
      const newItems = state.scan.staging.map(item => ({
        id: Date.now() + Math.random(),
        date: item.date,
        store: item.store,
        name: item.name,
        amount: item.amount,
        category: item.category,
        owner: item.owner,
        payer: item.payer
      }));
      state.data.receipts.unshift(...newItems);
      if(newItems.length > 0) {
          const key = `${newItems[0].date}::${newItems[0].store}`;
          state.expandedGroups[key] = true;
          state.historyMonth = newItems[0].date.substring(0, 7);
      }
      state.scan.staging = [];
      
      customAlert('帳簿に登録しました！');
      switchTab('history');
      saveData();
    }

    function recordSavings(owner) {
      const currentMonth = new Date().toISOString().substring(0, 7);
      const dataObj = state.data.personalFixed[owner];
      if (!dataObj.savingsHistory) {
         dataObj.savingsHistory = [];
      }
      
      const totalSavings = dataObj.savings.shared + dataObj.savings.personal;
      const existing = dataObj.savingsHistory.find(h => h.month === currentMonth);
      if (existing) {
         existing.amount = totalSavings;
      } else {
         dataObj.savingsHistory.push({ month: currentMonth, amount: totalSavings });
      }
      
      render();
      saveData();
      customAlert('今月の貯金額を登録しました！');
    }

    // ==========================================
    // アプリ初期化
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      // 初期描画（デフォルトデータで画面を即時表示）
      render();
      // その後、バックエンドから最新データを非同期取得
      initApp();
    });

  <script>
    function showModal(title, message, type, onConfirm) {
      const modal = document.getElementById('custom-modal');
      const panel = document.getElementById('custom-modal-panel');
      const titleEl = document.getElementById('custom-modal-title');
      const msgEl = document.getElementById('custom-modal-message');
      const btnsEl = document.getElementById('custom-modal-buttons');

      titleEl.textContent = title;
      msgEl.textContent = message;
      btnsEl.innerHTML = '';

      const close = () => {
        modal.classList.remove('opacity-100');
        panel.classList.remove('scale-100');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 200);
      };

      if (type === 'confirm') {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-sm transition-colors hover:bg-slate-200';
        cancelBtn.textContent = 'キャンセル';
        cancelBtn.onclick = close;

        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'px-4 py-2 bg-red-500 text-white rounded-xl font-bold text-sm shadow-sm transition-colors hover:bg-red-600';
        confirmBtn.textContent = '削除する';
        if (title.includes('初期化')) {
          confirmBtn.textContent = '初期化する';
        }
        confirmBtn.onclick = () => {
          close();
          if (onConfirm) onConfirm();
        };

        btnsEl.appendChild(cancelBtn);
        btnsEl.appendChild(confirmBtn);
      } else {
        const okBtn = document.createElement('button');
        okBtn.className = 'px-5 py-2 bg-blue-500 text-white rounded-xl font-bold text-sm shadow-sm transition-colors hover:bg-blue-600';
        okBtn.textContent = 'OK';
        okBtn.onclick = close;
        btnsEl.appendChild(okBtn);
      }

      modal.classList.remove('hidden');
      // trigger reflow
      void modal.offsetWidth;
      modal.classList.add('opacity-100');
      panel.classList.add('scale-100');
    }

    function customAlert(message) {
      showModal('お知らせ', message, 'alert');
    }

    function customConfirm(message, onConfirm) {
      showModal('確認', message, 'confirm', onConfirm);
    }
  </script>
</body>
</html>
